<div id="player-edit-modal" class="popup-overlay" style="display: flex;" aria-hidden="false"><div class="popup-card card pe-card" role="dialog" aria-modal="true" aria-labelledby="player-edit-modal-title">
    <div class="popup-header pe-head">
      <span class="pe-av" aria-hidden="true">R</span>
      <span class="pe-who"><h3 id="player-edit-modal-title">Riley Chen</h3></span>
      <span class="mgp-in pe-in">IN</span>
      <button type="button" class="pe-x secondary" data-role="close-popup" data-target="player-edit-modal" aria-label="Close">&times;</button>
    </div>
    <div class="popup-body pe-body" id="player-edit-modal-body">
    <div class="edit-row show popup-edit-row" data-player-key="id:e6142f">
      <div class="pe-f pe-2col">
        <span class="pe-cell">

          <input id="pe-first" type="text" class="edit-name popup-edit-input" placeholder="First" value="Riley" autocapitalize="words" autocomplete="off" spellcheck="false" />

        <span class="pe-cell">
          <label class="popup-edit-label" for="pe-last">Last name</label>
          <input id="pe-last" type="text" class="edit-lastname popup-edit-input" placeholder="Last" value="Chen" autocapitalize="words" autocomplete="off" spellcheck="false" />
        </span>
      </div>
      <div class="pe-f">
        <label class="popup-edit-label" for="pe-skill">Skill</label>
        <div class="pe-skillrow">
          <input id="pe-skill" type="number" class="edit-skill popup-edit-input pe-skillin" placeholder="Skill" step="0.5" min="0" max="10" value="6.5" />
        </div>
      </div>
      <input type="hidden" class="edit-group"  value="Regulars" />
      <input type="hidden" class="edit-groups" value="[&quot;Regulars&quot;,&quot;Sunday&quot;]" />
    </div>
    </div>
