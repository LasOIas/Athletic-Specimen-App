<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage - Add a team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_as.css">
<link rel="stylesheet" href="../_rounds.css">
<link rel="stylesheet" href="../_shared.css">
<link rel="stylesheet" href="../_motion-app.css">
<script src="../_shared.js" defer></script>
<script src="../_motion-app.js" defer></script>
</head>
<body class="pd-public-active">
<div id="root">
<div id="app-shell">
  <img class="pd-watermark" src="https://athletic-specimen.com/logo-mark.png" alt="" aria-hidden="true" />
  <header id="app-header" class="pd-header">
    <span class="app-header-mode">PUBLIC</span>
    <div class="pd-wordmark">
      <div class="pd-wm-1">ATHLETIC SPECIMEN</div>
      <div class="pd-wm-2">COLORADO</div>
    </div>
    <div class="pd-hgrp">
      <button type="button" class="pd-avic is-signedin" id="pd-account" aria-label="Account: signed in">M</button>
    </div>
    <div id="js-sync-notice"><p class="small shared-sync-notice is-live">Updated 7:42 PM</p></div>
  </header>
  <div id="app-content">
    <div id="tab-manage" class="tab-panel active">
      <div class="container">
<div class="pd-pagehdr"><button type="button" class="pd-back" data-mgt-view="teams" aria-label="Back to Teams &amp; payment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><div class="pd-htitle">Add a team</div></div><section class="rf-page mgv-taform">
      <div class="rf-sect">Team name</div>
      <div class="rf-fld"><input class="rf-tinput" id="mgta-team" type="text" placeholder="Pick a team name" autocomplete="off" autocapitalize="words" spellcheck="false" value="Dig Deep" /></div>

      <div class="rf-plhead"><span class="rf-sect">Players</span><span class="rf-plhint">4 per team &middot; at least 1 guy + 1 girl</span></div>
      <div class="rf-pllist"><div class="rf-prow mgv-tarow is-picked">
      <span class="rf-pnum">1</span>
      <input class="rf-pinput" id="mgta-p1" type="text" placeholder="First and Last Name" autocomplete="off" autocapitalize="words" spellcheck="false" value="Harper Ellis" />
    </div><div class="rf-prow mgv-tarow">
      <span class="rf-pnum">2</span>
      <input class="rf-pinput" id="mgta-p2" type="text" placeholder="First and Last Name" autocomplete="off" autocapitalize="words" spellcheck="false" />
    </div><div class="rf-prow mgv-tarow">
      <span class="rf-pnum">3</span>
      <input class="rf-pinput" id="mgta-p3" type="text" placeholder="First and Last Name" autocomplete="off" autocapitalize="words" spellcheck="false" />
    </div><div class="rf-prow mgv-tarow">
      <span class="rf-pnum">4</span>
      <input class="rf-pinput" id="mgta-p4" type="text" placeholder="First and Last Name" autocomplete="off" autocapitalize="words" spellcheck="false" />
    </div></div>
      <div class="rf-divlab"><span>Payment</span></div>
      <div class="mgr-tog mgv-tapay"><div class="mg-rb"><div class="mg-rn">Marked paid</div><div class="mg-rs">$80 a team &middot; no Venmo record for teams you add</div></div><button type="button" class="mg-sw" data-mgta-paid role="switch" aria-checked="false" aria-label="Marked paid"></button></div>

      <button type="button" class="rf-cta" data-mgta-save>Add team</button>
    </section>
      </div>
    </div>
  </div>
  <nav id="bottom-nav">
    <button class="nav-btn" data-nav-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-nav-tab="tournament">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a3 3 0 0 0 3 3"/><path d="M17 6h3a3 3 0 0 1-3 3"/></svg>
      <span>Tournament</span>
    </button>
    <button class="nav-btn active" data-nav-tab="manage" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg>
      <span>Manage</span>
    </button>
  </nav>
</div>
</div>
</body>
</html>
